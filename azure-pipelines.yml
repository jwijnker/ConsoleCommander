# ASP.NET
# Build and test ASP.NET projects.
# Add steps that publish symbols, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/aspnet/build-aspnet-4

trigger:
 branches:
   include:
     - master
     - feature/*
     - release/*

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:

- task: UseDotNet@2
  displayName: 'Use .NET SDK (from global.json)'
  inputs:
    packageType: 'sdk'
    useGlobalJson: true
    includePreview: true
    checkForExistingVersion: true

# Use dotnet restore/build/test for SDK-style projects (.NET Standard / .NET 10)
- task: DotNetCoreCLI@2
  displayName: 'Restore (dotnet)'
  inputs:
    command: 'restore'
    projects: '$(solution)'

- task: DotNetCoreCLI@2
  displayName: 'Build (dotnet)'
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Test (dotnet)'
  inputs:
    command: 'test'
    projects: '**/*Tests/*.csproj'
    arguments: '--configuration $(buildConfiguration) --no-build --verbosity normal'

# Package a project
- task: DotNetCoreCLI@2
  displayName: 'Package project'
  enabled: false
  inputs:
    command: 'pack'
    packagesToPack: '**/ConsoleCommander.csproj'
    versioningScheme: 'bySemVerBuildNumber'
